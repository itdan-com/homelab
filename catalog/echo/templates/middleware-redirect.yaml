{{- if and .Values.ingress.enabled .Values.ingress.tls.enabled }}
# Bounces every plain-HTTP request to the HTTPS door, permanently
# (301). Per-chart rather than a global entrypoint redirect so each
# chart stays self-contained and can opt out — catalog pluggability
# over cluster-wide mutable state.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "catalog.fullname" . }}-redirect-https
  labels:
    {{- include "catalog.labels" . | nindent 4 }}
spec:
  redirectScheme:
    scheme: https
    permanent: true
    {{- with .Values.ingress.tls.redirectPort }}
    port: {{ . | quote }}
    {{- end }}
{{- end }}
