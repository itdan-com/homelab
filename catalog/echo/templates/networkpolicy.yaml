{{- if .Values.networkPolicy.enabled }}
# Ingress allowlist. The moment any Ingress policy selects a pod, Cilium
# flips it to default-deny and only the named sources get through — every
# other connection is a per-flow `Policy denied DROPPED` in Hubble. Plain
# networking.k8s.io/v1 (not CiliumNetworkPolicy) on purpose: it is
# portable to any conformant CNI, DOKS included (ADR-003).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "catalog.fullname" . }}-ingress
  labels:
    {{- include "catalog.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "catalog.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    {{- range .Values.networkPolicy.allowFrom }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .namespace }}
          {{- with .podLabels }}
          podSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
          {{- end }}
      ports:
        - protocol: TCP
          port: {{ $.Values.service.targetPort }}
    {{- end }}
{{- end }}
