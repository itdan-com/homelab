# The credential, from SOPS. Rendered only when a token is present so a
# `helm template` without secrets still works for review and CI — and so
# an adopter who has not pasted a token yet gets a clear ImagePull-free
# failure (missing Secret) rather than a server that starts and silently
# authenticates as nobody.
{{- if .Values.auth.token }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "catalog.fullname" . }}
  labels:
    {{- include "catalog.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ .Values.auth.token | quote }}
{{- end }}
