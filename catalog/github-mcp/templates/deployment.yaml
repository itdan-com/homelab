apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "catalog.fullname" . }}
  labels:
    {{- include "catalog.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "catalog.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "catalog.labels" . | nindent 8 }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          image: {{ include "catalog.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          # Native Streamable HTTP mode (v1.8.0+). The alternative,
          # stdio, is what GitHub App auth requires — and is why this
          # chart uses a token instead (7.1 finding): a Deployment
          # fronted by an HTTP proxy cannot speak stdio.
          args:
            - "http"
            - "--host=0.0.0.0"
            - "--port={{ .Values.service.targetPort }}"
            {{- if .Values.github.toolsets }}
            - "--toolsets={{ join "," .Values.github.toolsets }}"
            {{- end }}
            {{- if .Values.github.readOnly }}
            - "--read-only"
            {{- end }}
          # NO CREDENTIAL. Not "a secret mounted carefully" — none at
          # all. In http mode this server has no static token (verified
          # against the shipped v1.8.0 binary: its ServerConfig has no
          # token field, and GITHUB_PERSONAL_ACCESS_TOKEN in the
          # environment is silently ignored while every request without
          # an Authorization header gets a 401). Every call carries a
          # per-request credential, injected by Sentinel's door — the
          # component that just authorized it.
          #
          # The consequence is the best security property in this
          # chart: compromising this pod steals NOTHING. There is no
          # token in its environment, its filesystem, or its Secrets.
          env:
            {{- with .Values.github.host }}
            - name: GITHUB_HOST
              value: {{ . | quote }}
            {{- end }}
          ports:
            - name: {{ .Values.service.portName }}
              containerPort: {{ .Values.service.targetPort }}
          readinessProbe:
            tcpSocket:
              port: {{ .Values.service.targetPort }}
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            # readOnlyRootFilesystem is on, so anything that wants to
            # write needs an explicit, empty, non-persistent home.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
