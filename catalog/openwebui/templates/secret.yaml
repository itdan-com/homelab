{{/*
Secret carrying the per-consumer gateway key OpenWebUI presents to the
AI gateway as OPENAI_API_KEY (Bearer token). The value comes from
.Values.gateway.apiKey, which is overridden by the SOPS-encrypted
secrets.enc.yaml at install time:
  helm secrets install openwebui . -n chat -f secrets.enc.yaml

Rendered only when the key is set, so `helm template` without the key
still produces valid manifests (the deployment's envFrom tolerates a
missing key — it just won't reach the gateway until one is supplied).
*/}}
{{- if .Values.gateway.apiKey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "catalog.fullname" . }}-auth
  labels:
    {{- include "catalog.labels" . | nindent 4 }}
type: Opaque
stringData:
  # OpenWebUI reads OPENAI_API_KEY as the Bearer token for its
  # OpenAI-compatible endpoint (OPENAI_API_BASE_URL).
  OPENAI_API_KEY: {{ .Values.gateway.apiKey | quote }}
{{- end }}
