{{/*
Secret carrying OpenWebUI's credentials, both SOPS-fed:
  OPENAI_API_KEY      — per-consumer gateway key (gateway.apiKey)
  OAUTH_CLIENT_SECRET — OIDC client secret for SSO (sso.clientSecret);
                        the authentik chart's SOPS file holds the SAME
                        value — the two ends of one credential.
Values come from the SOPS-encrypted secrets.enc.yaml at install time:
  helm secrets install openwebui . -n chat -f secrets.enc.yaml

Rendered only when at least one credential is set, so `helm template`
without secrets still produces valid manifests (the deployment's
envFrom is guarded by the same condition).
*/}}
{{- if or .Values.gateway.apiKey .Values.sso.clientSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "catalog.fullname" . }}-auth
  labels:
    {{- include "catalog.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- with .Values.gateway.apiKey }}
  # OpenWebUI reads OPENAI_API_KEY as the Bearer token for its
  # OpenAI-compatible endpoint (OPENAI_API_BASE_URL).
  OPENAI_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.sso.clientSecret }}
  # OIDC client secret for the "openwebui" client at Authentik.
  OAUTH_CLIENT_SECRET: {{ . | quote }}
  {{- end }}
{{- end }}
