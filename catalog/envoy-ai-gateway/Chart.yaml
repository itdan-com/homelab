apiVersion: v2
name: envoy-ai-gateway
description: >-
  Envoy AI Gateway control plane (CRDs + controller) wrapped for the
  catalog. Owns the aigateway.envoyproxy.io CRDs that
  catalog/ai-gateway's routes and backends instantiate, and runs the
  controller that injects the token-metering ext-proc sidecar into
  EG's data plane (the Phase 3 KEDA signal comes from that sidecar).
  Lives in upstream-default envoy-ai-gateway-system because
  catalog/envoy-gateway's pinned extensionManager FQDN expects it
  there. Same DR lesson as envoy-gateway: was a pet, now a citizen.
type: application
version: 0.1.0
appVersion: "v1.0.0"

dependencies:
  - name: ai-gateway-crds-helm
    # Pinned — bump deliberately, together with ai-gateway-helm below
    # and catalog/envoy-gateway, record in phase Notes.
    version: v1.0.0
    repository: oci://docker.io/envoyproxy
  - name: ai-gateway-helm
    version: v1.0.0
    repository: oci://docker.io/envoyproxy

annotations:
  catalog.homelab/needs-sso: "false"
  catalog.homelab/llm-traffic: "false"
  catalog.homelab/wants-vector: "false"
  catalog.homelab/exposes-mcp: "false"
