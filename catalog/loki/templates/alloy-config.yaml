# Alloy's pipeline, as a ConfigMap the subchart mounts.
#
# Deliberately narrow: pod logs, labelled with the metadata a human
# actually filters by, and nothing else. Alloy can scrape metrics and
# traces too; enabling those here would duplicate Prometheus and
# quietly double the ingest bill for no new information.
#
# The `keep_labels` stage matters more than it looks. Loki charges — in
# memory and in query time — per unique label COMBINATION, so a label
# with unbounded values (a pod's UID, a request id) turns a healthy
# index into an unqueryable one. High-cardinality fields belong in the
# log LINE, where full-text search finds them, not in a label.
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-alloy-config
  labels:
    {{- include "catalog.labels" . | nindent 4 }}
data:
  config.alloy: |
    discovery.kubernetes "pods" {
      role = "pod"
    }

    discovery.relabel "pods" {
      targets = discovery.kubernetes.pods.targets

      // Only THIS node's pods. The chart sets K8S_NODE_NAME from the
      // downward API; naming a variable that does not exist does not
      // error — it silently matches nothing, or matches everything on
      // every node and stores each line once per node.
      rule {
        source_labels = ["__meta_kubernetes_pod_node_name"]
        regex         = env("K8S_NODE_NAME")
        action        = "keep"
      }
      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label  = "container"
      }
      // The catalog's own label, so a query can ask "everything that
      // fronts MCP" or "everything carrying LLM traffic" rather than
      // requiring somebody to remember which namespaces those are.
      rule {
        source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
        target_label  = "app"
      }
    }

    loki.source.kubernetes "pods" {
      targets    = discovery.relabel.pods.output
      forward_to = [loki.process.trim.receiver]
    }

    loki.process "trim" {
      forward_to = [loki.write.default.receiver]

      // Keep the label set small and BOUNDED. Anything not listed here
      // stays in the line and is found by search.
      stage.label_keep {
        values = ["namespace", "pod", "container", "app"]
      }
    }

    loki.write "default" {
      endpoint {
        url = "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
      }
    }
