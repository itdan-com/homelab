nameOverride: ""
fullnameOverride: ""

catalog:
  tier: dev
  # Consumer API keys ride in this release's secrets.enc.yaml.
  dataClass: secret

# ---------------------------------------------------------------------------
# Model catalog (data-driven: adding a model is a one-line entry).
# Each entry exposes one model name on the unified /v1 endpoint and pins it
# to a backend below. Adding a model = one entry here (+ pull it in Ollama
# or add the cloud backend it lives on).
# ---------------------------------------------------------------------------
models:
  - name: qwen3.5:9b
    backend: ollama

# Where model traffic goes. schema OpenAI = backend speaks the
# OpenAI-compatible /v1 surface (Ollama does natively).
backends:
  - name: ollama
    schema: OpenAI
    # Resolves to the Windows host via the CoreDNS override
    # (k3d/coredns-custom.yaml) — never hardcode the gateway IP.
    fqdn: host.docker.internal
    port: 11434

# ---------------------------------------------------------------------------
# Per-consumer API keys. NEVER put real values here — they live in
# secrets.enc.yaml (SOPS). Shape per item:
#   - name: openwebui        # client id, becomes the Secret key => audit trail
#     apiKey: sk-...         # field MUST be named `apiKey` so .sops.yaml's
#                            # encrypted_regex encrypts it
# ---------------------------------------------------------------------------
consumers: []

gateway:
  # GatewayClass is cluster-scoped: exactly one release should own it.
  createClass: true
  className: ai-gateway
  listenerPort: 80

envoyProxy:
  # LoadBalancer would make k3s svclb fight Traefik for host ports 80/443.
  serviceType: ClusterIP
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi

# Stable in-namespace name (http://<fullname>/v1) for consumers: an
# ExternalName alias to the EG-generated Service (see templates/service.yaml
# for how the deterministic hash suffix is computed).
service:
  # Namespace Envoy Gateway provisions data-plane infra into.
  controllerNamespace: envoy-gateway-system
  port: 80

# Envoy's default 32KiB per-connection buffer truncates LLM request bodies.
clientBufferLimit: 50Mi

# Prometheus scrape of the extproc token metrics (gen_ai_* series).
metrics:
  enabled: true
  interval: 15s

# Autoscaling of the Envoy data plane.
#   off  -> fixed replicas (EG default)
#   hpa  -> EG-managed HPA on CPU (baseline; rendered into the EnvoyProxy CR)
#   keda -> KEDA ScaledObject on the Prometheus token-rate signal
# hpa and keda are mutually exclusive — both create an HPA under the
# hood, and two HPAs fighting over one Deployment is a flapping mess.
autoscaling:
  # "off" | "hpa" | "keda" — quoted deliberately: bare `off` is YAML-1.1
  # boolean false. keda = the Phase 3 end state (token-rate scaling).
  mode: "keda"
  minReplicas: 1
  # Hard ceiling for the WSL2 budget.
  maxReplicas: 3
  hpa:
    targetCPUUtilizationPercent: 70
  keda:
    pollingInterval: 15
    # NOTE: cooldownPeriod only governs scale-TO-ZERO. With
    # minReplicas >= 1, scale-down pace is the HPA's scaleDown
    # stabilization window (default 300s) — verified live 2026-07-25.
    cooldownPeriod: 120
    prometheusUrl: http://monitoring-kube-prometheus-prometheus.monitoring:9090
    # Output tokens/sec across the gateway; ~one active qwen3.5 stream
    # is ~70 tok/s, so 30/replica scales a busy demo toward the ceiling.
    query: sum(rate(gen_ai_client_token_usage_sum{gen_ai_token_type="output"}[1m]))
    threshold: "30"
