# Envoy's default 32KiB client buffer is too small for LLM request bodies.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: {{ include "catalog.fullname" . }}-buffer
  labels:
    {{- include "catalog.labels" . | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ include "catalog.fullname" . }}
  connection:
    bufferLimit: {{ .Values.clientBufferLimit }}
