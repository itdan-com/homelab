# Data-plane knobs for the provisioned Envoy fleet (referenced by the
# Gateway's infrastructure.parametersRef).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: {{ include "catalog.fullname" . }}-proxy
  labels:
    {{- include "catalog.labels" . | nindent 4 }}
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        type: {{ .Values.envoyProxy.serviceType }}
      envoyDeployment:
        container:
          resources:
            {{- toYaml .Values.envoyProxy.resources | nindent 12 }}
      {{- if eq .Values.autoscaling.mode "hpa" }}
      # EG-managed HPA (the operator-sanctioned way to autoscale the
      # data plane it provisions). Mutually exclusive with mode "keda".
      envoyHpa:
        minReplicas: {{ .Values.autoscaling.minReplicas }}
        maxReplicas: {{ .Values.autoscaling.maxReplicas }}
        metrics:
          - type: Resource
            resource:
              name: cpu
              target:
                type: Utilization
                averageUtilization: {{ .Values.autoscaling.hpa.targetCPUUtilizationPercent }}
      {{- end }}
