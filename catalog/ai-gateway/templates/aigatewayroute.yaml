# One routing rule per entry in .Values.models. The gateway's ext-proc
# extracts `model` from the request body and stamps it into the
# x-ai-eg-model header — clients just send normal OpenAI JSON.
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIGatewayRoute
metadata:
  name: {{ include "catalog.fullname" . }}-models
  labels:
    {{- include "catalog.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ include "catalog.fullname" . }}
      kind: Gateway
      group: gateway.networking.k8s.io
  rules:
    {{- range .Values.models }}
    # weight/priority/modelsOwnedBy are the controller's defaults made
    # explicit — the AI-gateway controller stamps them into live specs,
    # and leaving them implicit puts ArgoCD in a permanent diff loop.
    - matches:
        - headers:
            - type: Exact
              name: x-ai-eg-model
              value: {{ .name | quote }}
      modelsOwnedBy: Envoy AI Gateway
      backendRefs:
        - name: {{ include "catalog.fullname" $ }}-{{ .backend }}
          weight: 1
          priority: 0
    {{- end }}
