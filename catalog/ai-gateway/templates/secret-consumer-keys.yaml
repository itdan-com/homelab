{{- if .Values.consumers }}
# One entry per consumer: key = client id, value = API key.
# Values arrive via secrets.enc.yaml (SOPS) — never plaintext in git.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "catalog.fullname" . }}-consumer-keys
  labels:
    {{- include "catalog.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range .Values.consumers }}
  {{ .name }}: {{ .apiKey | quote }}
  {{- end }}
{{- end }}
