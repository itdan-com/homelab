# OIDC client blueprints (Phase 5 B4) — Authentik config-as-code,
# REQUIRED per ADR-002: SSO must assemble headless on a machine nobody
# clicked. The worker mounts this ConfigMap (subchart value
# authentik.blueprints.configMaps) and applies every *.yaml key on
# startup and on change; `state: present` makes git the authority —
# drift in the UI is overwritten on the next apply.
#
# Secrets NEVER appear here: each client secret rides the SOPS file as
# an authentik.authentik.<app>_oidc_client_secret leaf, surfaces in
# the pods as an AUTHENTIK_* env var via the chart's rendered Secret,
# and is referenced below with !Env — resolved by the worker at apply
# time, same road the akadmin bootstrap credentials travel.
#
# NOTE: the ConfigMap name is static (not fullname-templated) because
# blueprints.configMaps takes literal names; the release name is
# pinned to "authentik" by argo.yaml anyway.
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprints
  labels:
    {{- include "catalog.labels" . | nindent 4 }}
data:
  {{- with .Values.oidcClients.openwebui }}
  openwebui-oidc.yaml: |
    version: 1
    metadata:
      name: openwebui-oidc
    entries:
      # Roles claim for OpenWebUI: group names filtered to this app's
      # prefix, delivered under the custom `roles` scope. Least
      # privilege: the app learns ONLY its own groups — unrelated
      # memberships never enter the token.
      - model: authentik_providers_oauth2.scopemapping
        state: present
        id: openwebui-roles-mapping
        identifiers:
          name: openwebui-roles
        attrs:
          scope_name: roles
          description: openwebui-* group names as the roles claim
          expression: |
            if not user:
                return {}
            return {"roles": [g.name for g in user.ak_groups.all() if g.name.startswith("openwebui-")]}
      # App-access groups. CONFIG is that they exist and gate the app;
      # MEMBERSHIP is runtime data (owner adds users in the UI) — a
      # blueprint-managed member list would wipe UI-added members on
      # every re-apply.
      - model: authentik_core.group
        state: present
        id: group-openwebui-users
        identifiers:
          name: openwebui-users
      - model: authentik_core.group
        state: present
        id: group-openwebui-admins
        identifiers:
          name: openwebui-admins
      # The provider is the OAuth2/OIDC engine: it owns the client
      # credentials, token signing, and the redirect-URI allowlist.
      - model: authentik_providers_oauth2.oauth2provider
        state: present
        id: openwebui-provider
        identifiers:
          name: OpenWebUI
        attrs:
          client_type: confidential
          client_id: {{ .clientId }}
          client_secret: !Env AUTHENTIK_OPENWEBUI_OIDC_CLIENT_SECRET
          # Grant-type allowlist. LOAD-BEARING: the admin UI preselects
          # authorization_code, but API/blueprint-created providers get
          # an EMPTY list — and authentik then rejects every authorize
          # request as "invalid_request" (log: "Invalid grant_type for
          # provider"). Least privilege: code flow + refresh only.
          grant_types:
            - authorization_code
            - refresh_token
          # Implicit consent: first-party app on our own platform —
          # no "allow access?" interstitial for our own users.
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          # Pin RS256 signing to the built-in cert so id_tokens verify
          # via the discovery document's jwks_uri (no key = HS256).
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          # Three standard OIDC scopes (email is what OpenWebUI keys
          # identity on) + our roles claim.
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
            - !KeyOf openwebui-roles-mapping
          redirect_uris:
            # v0.9.6's callback route, pinned explicitly on BOTH sides
            # (this allowlist + OPENID_REDIRECT_URI in the app's env)
            # so nothing depends on framework URL derivation.
            - matching_mode: strict
              url: {{ .baseUrl }}/oauth/oidc/login/callback
      # The application is the user-facing wrapper: portal tile, slug
      # in the discovery URL (/application/o/openwebui/), policy
      # attachment point for who may use it.
      - model: authentik_core.application
        state: present
        id: openwebui-app
        identifiers:
          slug: openwebui
        attrs:
          name: OpenWebUI
          provider: !KeyOf openwebui-provider
          # ONE-CLICK tile: launch straight into the app's OIDC
          # initiation route — the dance starts, implicit consent
          # passes (session already lives here), user lands signed in.
          # The app's own login page (with the break-glass form) still
          # exists for direct visits.
          meta_launch_url: {{ .baseUrl }}/oauth/oidc/login
      # IdP-side authorization (defense in depth IN FRONT of the app's
      # own role check): only members of the two groups pass the
      # authorize endpoint — everyone else is denied AT Authentik.
      - model: authentik_policies.policybinding
        state: present
        identifiers:
          target: !KeyOf openwebui-app
          group: !KeyOf group-openwebui-users
        attrs:
          order: 10
          enabled: true
      - model: authentik_policies.policybinding
        state: present
        identifiers:
          target: !KeyOf openwebui-app
          group: !KeyOf group-openwebui-admins
        attrs:
          order: 20
          enabled: true
  {{- end }}
  {{- with .Values.oidcClients.grafana }}
  grafana-oidc.yaml: |
    version: 1
    metadata:
      name: grafana-oidc
    entries:
      - model: authentik_providers_oauth2.scopemapping
        state: present
        id: grafana-roles-mapping
        identifiers:
          name: grafana-roles
        attrs:
          scope_name: roles
          description: grafana-* group names as the roles claim
          expression: |
            if not user:
                return {}
            return {"roles": [g.name for g in user.ak_groups.all() if g.name.startswith("grafana-")]}
      - model: authentik_core.group
        state: present
        id: group-grafana-users
        identifiers:
          name: grafana-users
      - model: authentik_core.group
        state: present
        id: group-grafana-admins
        identifiers:
          name: grafana-admins
      - model: authentik_providers_oauth2.oauth2provider
        state: present
        id: grafana-provider
        identifiers:
          name: Grafana
        attrs:
          client_type: confidential
          client_id: {{ .clientId }}
          client_secret: !Env AUTHENTIK_GRAFANA_OIDC_CLIENT_SECRET
          # grant_types from birth — the B5 lesson: API-created
          # providers get an EMPTY allowlist and reject every
          # authorize. Code flow + refresh only.
          grant_types:
            - authorization_code
            - refresh_token
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
            - !KeyOf grafana-roles-mapping
          redirect_uris:
            # Grafana's fixed callback route, derived from root_url.
            - matching_mode: strict
              url: {{ .baseUrl }}/login/generic_oauth
      - model: authentik_core.application
        state: present
        id: grafana-app
        identifiers:
          slug: grafana
        attrs:
          name: Grafana
          provider: !KeyOf grafana-provider
          # ONE-CLICK tile: /login/generic_oauth without a code param
          # IS Grafana's OIDC initiation route.
          meta_launch_url: {{ .baseUrl }}/login/generic_oauth
      - model: authentik_policies.policybinding
        state: present
        identifiers:
          target: !KeyOf grafana-app
          group: !KeyOf group-grafana-users
        attrs:
          order: 10
          enabled: true
      - model: authentik_policies.policybinding
        state: present
        identifiers:
          target: !KeyOf grafana-app
          group: !KeyOf group-grafana-admins
        attrs:
          order: 20
          enabled: true
  {{- end }}
  {{- with .Values.oidcClients.argocd }}
  argocd-oidc.yaml: |
    version: 1
    metadata:
      name: argocd-oidc
    entries:
      # ArgoCD reads a `groups` claim (its RBAC default), so this
      # mapping uses scope_name groups — still prefix-filtered. The
      # provider deliberately does NOT attach the built-in profile
      # mapping: authentik's profile emits ALL group names as its own
      # `groups` key and would collide with this one.
      - model: authentik_providers_oauth2.scopemapping
        state: present
        id: argocd-groups-mapping
        identifiers:
          name: argocd-groups
        attrs:
          scope_name: groups
          description: argocd-* group names as the groups claim
          expression: |
            if not user:
                return {}
            return {"groups": [g.name for g in user.ak_groups.all() if g.name.startswith("argocd-")]}
      - model: authentik_core.group
        state: present
        id: group-argocd-users
        identifiers:
          name: argocd-users
      - model: authentik_core.group
        state: present
        id: group-argocd-admins
        identifiers:
          name: argocd-admins
      - model: authentik_providers_oauth2.oauth2provider
        state: present
        id: argocd-provider
        identifiers:
          name: ArgoCD
        attrs:
          client_type: confidential
          client_id: {{ .clientId }}
          client_secret: !Env AUTHENTIK_ARGOCD_OIDC_CLIENT_SECRET
          # grant_types from birth — the B5 lesson.
          grant_types:
            - authorization_code
            - refresh_token
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          # openid + email + our filtered groups; NO profile (see
          # mapping comment above).
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !KeyOf argocd-groups-mapping
          redirect_uris:
            # ArgoCD's fixed OIDC callback, derived from its url.
            - matching_mode: strict
              url: {{ .baseUrl }}/auth/callback
      - model: authentik_core.application
        state: present
        id: argocd-app
        identifiers:
          slug: argocd
        attrs:
          name: ArgoCD
          provider: !KeyOf argocd-provider
          # ONE-CLICK tile: /auth/login is ArgoCD's OIDC initiation.
          meta_launch_url: {{ .baseUrl }}/auth/login
      - model: authentik_policies.policybinding
        state: present
        identifiers:
          target: !KeyOf argocd-app
          group: !KeyOf group-argocd-users
        attrs:
          order: 10
          enabled: true
      - model: authentik_policies.policybinding
        state: present
        identifiers:
          target: !KeyOf argocd-app
          group: !KeyOf group-argocd-admins
        attrs:
          order: 20
          enabled: true
  {{- end }}
  {{- range $key, $app := .Values.linkApps }}
  {{- if $app.enabled }}
  {{ $key }}-link.yaml: |
    version: 1
    metadata:
      name: {{ $key }}-link
    entries:
      # An application with NO provider — authentik's way to publish a
      # plain bookmark on the user portal. Authentik does not
      # authenticate, authorize, or proxy the destination; it only
      # renders a tile. That distinction is the entire point here for
      # Sentinel (ADR-004): the platform's surfaces should be findable
      # in one place, but the kill switch must not depend on an
      # in-cluster IdP whose group definitions live in this repo.
      - model: authentik_core.group
        state: present
        id: group-{{ $key }}-link
        identifiers:
          name: {{ $app.group }}
      - model: authentik_core.application
        state: present
        id: {{ $key }}-link-app
        identifiers:
          slug: {{ $app.slug }}
        attrs:
          name: {{ $app.name }}
          meta_description: {{ $app.description | quote }}
          meta_launch_url: {{ $app.url }}
          # Opens in a new tab: the destination is not part of this
          # portal's origin and, for Sentinel, not even on the cluster.
          open_in_new_tab: true
      - model: authentik_policies.policybinding
        state: present
        identifiers:
          target: !KeyOf {{ $key }}-link-app
          group: !KeyOf group-{{ $key }}-link
        attrs:
          order: 10
          enabled: true
  {{- end }}
  {{- end }}
