nameOverride: ""
fullnameOverride: ""

catalog:
  tier: dev
  # dataClass secret: this release holds the session-signing
  # secret_key, akadmin bootstrap credentials, and the DB password —
  # all SOPS-encrypted in secrets.enc.yaml (argo.yaml: secrets "true").
  dataClass: secret

# Authentik's public door (Phase 5 B3) — house TLS pattern, rendered
# by OUR template (templates/authentik-ingress.yaml); the subchart's
# own ingress stays disabled. Passes ADR-002's exposure policy: it is
# literally the thing that authenticates.
authentikIngress:
  enabled: true
  host: authentik.lab.local
  # The subchart's server Service (release name + "-server"), stated
  # explicitly; release name is pinned by argo.yaml.
  service: authentik-server
  port: 80
  tls:
    issuer: lab-local-ca
    redirectPort: "8443"

# OIDC clients this IdP serves (Phase 5 B4) — rendered into blueprints
# by templates/oidc-blueprints.yaml, applied headless by the worker
# (config-as-code, ADR-002). Client secrets live ONLY in the SOPS file
# (authentik.authentik.<app>_oidc_client_secret → AUTHENTIK_* env var,
# referenced in the blueprint via !Env) — never here, never in git.
oidcClients:
  openwebui:
    # client_id is public and deterministic on purpose: OpenWebUI's
    # side (B5) can hardcode it in values; only the secret is secret.
    clientId: openwebui
    # The app's public origin; the OIDC redirect URI derives from it.
    baseUrl: https://openwebui.lab.local:8443
  grafana:
    clientId: grafana
    baseUrl: https://grafana.lab.local:8443
  argocd:
    clientId: argocd
    baseUrl: https://argocd.lab.local:8443
  mcp:
    # The Airlock door's client (7.3.2, re-homed 7.3.3). Authentik's
    # client here is the DOOR ITSELF, not anybody's MCP client: people
    # sign in to the door, the door federates that sign-in to
    # Authentik, and the door issues its own resource-bound tokens.
    # So exactly one redirect URI matters — the door's callback.
    clientId: mcp-door
    # The door's public origin. Cloud (ADR-002) sets https://mcp.<domain>.
    doorOrigin: https://localhost:8402

# Portal tiles for platform surfaces that are deliberately NOT SSO
# clients. These create an authentik *application with no provider* —
# a bookmark. It carries no authority: authentik neither authenticates
# nor authorizes the destination, it only puts a link on the portal so
# the platform's surfaces are findable in one place.
#
# Sentinel is here for a load-bearing reason, not an oversight. See
# docs/adr/ADR-004 "Rejected: Sentinel behind Authentik SSO" — the
# broker's admin surface must not depend on an in-cluster identity
# provider whose groups are defined in this very repo, because the
# operator Claude opens PRs against this repo. The tile is the only
# safe part of that idea.
linkApps:
  sentinel:
    enabled: true
    name: Sentinel
    slug: sentinel
    # Environment-specific by design (ADR-004): loopback locally,
    # a VPN-reachable host in cloud. Never a cluster address.
    # `localhost`, not `127.0.0.1`: WebAuthn's Relying Party ID must be
    # a domain, so the passkey only works on the named host (5.5.6).
    url: http://localhost:8400/
    description: >-
      Capability broker and kill switch. Runs OUTSIDE the cluster and
      authenticates you with its own passkey — by design, this link is
      a bookmark, not a single sign-on.
    # Who SEES the tile — a visibility audience, not an authorization.
    # authentik's built-in admin group is used because it is populated
    # at bootstrap, so the tile appears with zero manual membership
    # management (a group nobody is in renders an invisible tile —
    # authentik filters the portal per user, which is exactly how this
    # was caught). Referenced read-only via !Find, never created or
    # updated: a blueprint that writes to the built-in admin group
    # could strip its superuser flag and lock the owner out.
    #
    # Seeing the link is NOT permission to use the console. Sentinel
    # decides that itself, with a passkey (5.5.6) — per ADR-004, who may
    # APPROVE is a deliberately separate, smaller set than who may see
    # where the console lives.
    group: authentik Admins

# ---------------------------------------------------------------------------
# Subchart values. Every leaf under `authentik:` below becomes an
# AUTHENTIK_* env var via the chart's rendered Secret — which is how
# the SOPS overrides (secret_key, bootstrap_*, postgresql.password)
# reach the pods without a hand-rolled Secret template.
# NOTE: no commonLabels-style knob upstream (keda precedent: skip
# where unsupported) — catalog labels ride on OUR door template.
# ---------------------------------------------------------------------------
authentik:
  # Mount our blueprint ConfigMap into the worker (literal names —
  # see templates/oidc-blueprints.yaml). Content changes re-apply via
  # the worker's file watcher; no restart needed after the first roll.
  blueprints:
    configMaps:
      - authentik-blueprints
  authentik:
    # Signs sessions/cookies/tokens. Rotating it logs everyone out.
    # Real value via SOPS; this default fails closed.
    secret_key: CHANGE_ME_VIA_SOPS_SECRETS
    error_reporting:
      # No telemetry to authentik's cloud from a reference platform.
      enabled: false
    # First-boot-only bootstrap of the akadmin account (password +
    # API token via SOPS). Changing these later does nothing — that
    # is upstream behavior, not a bug here.
    bootstrap_email: admin@lab.local
    postgresql:
      # Our platform store (catalog/postgres) across namespaces —
      # authentik pods live in `authentik`, postgres in `chat`.
      host: postgres.chat.svc.cluster.local
      port: 5432
      name: authentik
      user: authentik
      password: CHANGE_ME_VIA_SOPS_SECRETS

  server:
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 1Gi

  worker:
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 384Mi
      limits:
        memory: 768Mi

  # We bring our own Postgres; the bundled subchart stays off. (Redis
  # is gone entirely upstream since 2025.10 — nothing to disable.)
  postgresql:
    enabled: false
