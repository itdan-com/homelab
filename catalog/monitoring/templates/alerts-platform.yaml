# Alert rules for THIS platform (Phase 8), on top of the ~30 groups
# kube-prometheus-stack already ships.
#
# The bar every rule here has to clear: **a human should want to be
# told.** kube-prometheus-stack's defaults are tuned for a large fleet
# and fire on things a four-node lab does constantly — an alert that
# cries wolf trains its reader to ignore the next one, which is worse
# than having no alert at all. So this file is short on purpose, and
# each rule states what a human should DO about it.
#
# Deliberately absent, and worth saying why: nothing here alerts on CPU
# or memory percentages. "Memory is at 80%" is not an incident; a pod
# being OOM-killed is, and that shows up as a restart.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "catalog.fullname" . }}-platform
  labels:
    {{- include "catalog.labels" . | nindent 4 }}
    release: {{ .Release.Name }}   # the operator selects rules by this
spec:
  groups:
    - name: platform.rules
      rules:
        - alert: PodCrashLooping
          # 15m, not 5m: a pod that restarts twice during a deploy is
          # normal. A pod still restarting a quarter-hour later has a
          # problem no deploy is going to finish fixing.
          expr: increase(kube_pod_container_status_restarts_total[15m]) > 3
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "{{`{{ $labels.namespace }}/{{ $labels.pod }}`}} is crash-looping"
            description: >-
              More than three restarts in fifteen minutes. Check
              `kubectl -n {{`{{ $labels.namespace }}`}} logs
              {{`{{ $labels.pod }}`}} --previous` — the previous
              container's logs are the ones that explain the crash.

        - alert: PodNotScheduling
          expr: kube_pod_status_phase{phase="Pending"} == 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "{{`{{ $labels.namespace }}/{{ $labels.pod }}`}} has been Pending for 15m"
            description: >-
              Nothing is placing this pod. Usually capacity, an
              unbound PVC, or a node selector nothing satisfies —
              `kubectl describe pod` names which in its Events.

        - alert: ArgoCDApplicationUnhealthy
          # The GitOps controller is how everything else gets fixed, so
          # an app it cannot reconcile is a platform that has stopped
          # self-healing — even while every pod still looks fine.
          expr: argocd_app_info{health_status=~"Degraded|Missing"} == 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "ArgoCD app {{`{{ $labels.name }}`}} is {{`{{ $labels.health_status }}`}}"
            description: >-
              Desired state is not reachable. The platform has stopped
              converging on git for this app, which means the next
              change will not land either.

        - alert: ArgoCDApplicationSyncUnknown
          # ADR-009 D5: the in-cluster symptom of the git provider being
          # unreachable — apps flip to sync Unknown once ArgoCD can no
          # longer resolve the repo (~3-6 min into an outage). Health
          # stays green and workloads keep running; what this pages is
          # "the change pipeline is frozen and self-heal has stopped
          # enforcing", which is exactly when a human should know the
          # break-glass runbook applies. Also catches every other way
          # ArgoCD loses its source (creds, DNS), on purpose.
          expr: argocd_app_info{sync_status="Unknown"} == 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "ArgoCD app {{`{{ $labels.name }}`}} cannot reach its git source"
            description: >-
              Sync status Unknown means ArgoCD cannot fetch desired
              state — a GitHub outage looks exactly like this. Running
              workloads are unaffected and drift enforcement is paused.
              If a fix must land during the outage, pause auto-sync
              FIRST and commit before re-enabling (ADR-009 Decision 4).

        - alert: CertificateExpiringSoon
          # Every door on this platform is TLS, and a lab CA expiry is
          # the classic silent outage: nothing degrades until the day
          # it all fails at once.
          expr: (certmanager_certificate_expiration_timestamp_seconds - time()) / 86400 < 14
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Certificate {{`{{ $labels.name }}`}} expires in under 14 days"
            description: >-
              cert-manager renews automatically; this firing means
              renewal is NOT happening. Check the Certificate's status
              and the issuer.

    - name: airlock.rules
      # CLAUDE.md's anomaly list, expressed against what the platform
      # actually exports today. ADR-006 wired Sentinel's metrics and
      # audit copy in, so the kill-switch rule below is real now; the
      # remaining named anomalies (secret reuse, unexpected namespaces)
      # want the Loki copy and stay unwritten until queries exist that
      # can actually fire.
      rules:
        - alert: SentinelKillSwitchEngaged
          # Phase 8 item 6: every flip pages immediately. Engaging the
          # kill switch is a deliberate human act — the page is
          # awareness ("someone pulled the cord, everything MCP is
          # refusing"), not an accusation. It also catches the switch
          # being LEFT on after an incident ends.
          expr: sentinel_kill_switch_engaged == 1
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "Sentinel's global kill switch is ENGAGED"
            description: >-
              Every capability check is refusing while this is on. If
              the incident is over, release it from the console; if you
              did not engage it, treat that as the incident.

        - alert: SentinelMetricsAbsent
          # The eyes on the gate itself. Fires while Prometheus cannot
          # scrape the broker's /metrics — which is ALSO the expected
          # state between this chart landing and the owner's next
          # sentinel install (the route ships with the new code), so
          # the description says so instead of paging a mystery.
          expr: up{job="sentinel-broker"} == 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Prometheus cannot scrape Sentinel's broker"
            description: >-
              No metrics from the gate: kill-switch state, denials and
              grant gauges are all blind. If the ADR-006 sentinel
              install has not run yet this is expected (the /metrics
              route ships with it); otherwise check the broker unit and
              the sentinel-prometheus-client secret.

        - alert: SentinelAuditShippingSkipped
          # The skip-shaped divergence, distinct from the retry-shaped
          # one below: a 4xx makes the shipper advance PAST a batch
          # (deliberately — one poison batch must not wedge the copy),
          # which an adversary at the route could exploit to suppress
          # the copy while backlog stays zero. Skipped rows are
          # PERMANENT divergence, so any increase pages.
          expr: increase(sentinel_audit_shipping_skipped_rows_total[1h]) > 0
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: "Loki rejected Sentinel audit rows — permanent copy divergence"
            description: >-
              The shipper skipped rows Loki 4xx-rejected (count is an
              upper bound). The canonical record in Sentinel is intact;
              the Loki copy now permanently lacks lines. Check the
              admin unit's log for the rejected id range and why.

        - alert: SentinelAuditShippingStalled
          # ADR-006 named divergence between the canonical record and
          # the Loki copy as a signal worth alerting on. Backlog above
          # zero for half an hour means the copy is falling behind the
          # record — the shipper is failing, off, or the push route is
          # down. (30m = many retry ticks, so this never fires on one
          # blip.)
          expr: sentinel_audit_shipping_backlog_rows > 0
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Sentinel's audit copy to Loki is falling behind"
            description: >-
              Sealed audit rows are not reaching Loki. The canonical
              record in Sentinel is intact; what is degrading is the
              two-system tamper property and the dashboard's event
              view. Check the admin unit's log for `loki push` lines
              and the pushIngress route — or, if shipping was
              deliberately disabled on the host (empty
              SENTINEL_LOKI_PUSH_URL), silence this knowingly.

        - alert: MCPServerUnreachable
          # An MCP server that is down fails CLOSED (the proxy refuses),
          # so this is availability, not a security event. Said
          # explicitly because "MCP" in an alert name reads as scarier
          # than it is at 3am.
          expr: kube_deployment_status_replicas_available{namespace="mcp-servers"} == 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "MCP server {{`{{ $labels.deployment }}`}} has no available replicas"
            description: >-
              Calls to it are refused while it is down — the gate fails
              closed, so this is an outage for its users rather than an
              exposure.

        - alert: GatewayTokenRateAtCeiling
          # The KEDA signal pinned at its ceiling means demand exceeds
          # what the replica cap allows. Worth knowing BEFORE users
          # report slowness.
          expr: |
            sum(rate(gen_ai_client_token_usage_sum{gen_ai_token_type="output"}[5m]))
              > {{ .Values.alerts.tokenRateCeiling | default 80 }}
          for: 15m
          labels:
            severity: info
          annotations:
            summary: "AI gateway sustained at its scaling ceiling"
            description: >-
              Output token rate has been above the ceiling for fifteen
              minutes. If this is sustained rather than a burst, the
              replica cap or the per-replica threshold wants raising —
              both are values in catalog/ai-gateway.
