nameOverride: ""
fullnameOverride: ""

# Grafana's public door (Phase 5 A5) — rendered by OUR template
# (templates/grafana-ingress.yaml), not the subchart: the umbrella
# owns the door, the subchart owns the app. Passes ADR-002's exposure
# policy (browsed + authenticated). Prometheus/Alertmanager get NO
# door on purpose: unauthenticated by design until Phase 7 puts them
# behind SSO forward-auth.
grafanaIngress:
  enabled: true
  host: grafana.lab.local
  # The subchart's Service (release name + "-grafana") — stated
  # explicitly rather than derived; the release name is pinned by
  # argo.yaml anyway.
  service: monitoring-grafana
  port: 80
  tls:
    issuer: lab-local-ca
    redirectPort: "8443"

catalog:
  tier: dev
  # dataClass secret: this release holds a real credential (Grafana
  # admin password, SOPS-encrypted in secrets.enc.yaml).
  dataClass: secret

# SSO (Phase 5 B6): the OIDC client secret for Grafana's "Authentik"
# login. SOPS-only (secrets.enc.yaml, same value as the authentik
# chart's grafana_oidc_client_secret — two ends of one credential).
# templates/grafana-oidc-secret.yaml renders it as env var
# GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET (Grafana's env-over-ini
# convention keeps it out of the grafana.ini ConfigMap); the grafana
# subchart attaches it via envFromSecret below. NOTE: rotating it
# does NOT roll the pod (external secret, no checksum) — restart
# grafana manually after rotation.
oidc:
  clientSecret: ""

# ---------------------------------------------------------------------------
# UMBRELLA-CHART LABEL EXCEPTION: resources rendered by the dependency
# below can't use our _helpers.tpl include, so the six catalog labels are
# duplicated statically into commonLabels (best-effort — some sub-subchart
# resources only get a subset). Templates WE add to this chart (e.g. the
# ai-gateway ServiceMonitor) use the full helper as normal. Keep the two
# blocks in sync when tier/dataClass change.
# ---------------------------------------------------------------------------
kube-prometheus-stack:
  commonLabels:
    catalog.homelab/needs-sso: "true"
    catalog.homelab/llm-traffic: "false"
    catalog.homelab/wants-vector: "false"
    catalog.homelab/exposes-mcp: "false"
    catalog.homelab/tier: "dev"
    catalog.homelab/data-class: "secret"

  # k3s embeds controller-manager/scheduler/proxy/etcd inside the k3s
  # process — there are no separate endpoints to scrape. Leaving these
  # on produces permanently-firing TargetDown alerts (noise, not signal).
  kubeControllerManager:
    enabled: false
  kubeScheduler:
    enabled: false
  kubeProxy:
    enabled: false
  kubeEtcd:
    enabled: false

  prometheusOperator:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi

  prometheus:
    prometheusSpec:
      # Small footprint for the 31 GB WSL2 budget: short retention with a
      # hard size cap; metrics are ephemeral ops data — losing them on a
      # cluster rebuild is acceptable (unlike postgres/openwebui PVs).
      retention: 3d
      retentionSize: 4GB
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          memory: 1Gi
      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: local-path
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 5Gi
      # CRITICAL for the catalog pattern: nil-selectors default to
      # "only ServiceMonitors installed by THIS release". false = watch
      # all ServiceMonitors/PodMonitors cluster-wide, so the ai-gateway
      # monitor (and any future labeled chart's) is discovered without
      # touching this release.
      serviceMonitorSelectorNilUsesHelmValues: false
      podMonitorSelectorNilUsesHelmValues: false

  alertmanager:
    alertmanagerSpec:
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          memory: 128Mi

  grafana:
    # Real value injected from secrets.enc.yaml (SOPS) at install time.
    # Post-B6 this account is the BREAK-GLASS login (same decision as
    # OpenWebUI): humans arrive via SSO; admin + the form stay for
    # IdP-down days.
    adminPassword: ""
    # OIDC client secret as env (see top-level `oidc:` block).
    envFromSecret: grafana-oidc
    # Local-only (ADR-002): the lab CA so Grafana's SERVER-SIDE OAuth
    # calls (token_url/api_url over the canonical public URL) verify.
    # The cert comes from this chart's own door secret (grafana-tls,
    # ca.crt key). On cloud (Let's Encrypt): delete this mount and the
    # tls_client_ca line below.
    extraSecretMounts:
      - name: lab-ca
        secretName: grafana-tls
        mountPath: /etc/grafana/lab-ca
        readOnly: true
    grafana.ini:
      server:
        # Grafana must know its public URL or every generated link and
        # redirect claims localhost — and B6's OIDC redirect URIs are
        # built from this value, so it's set correctly BEFORE SSO.
        # ADR-002: on cloud this becomes https://grafana.<domain>/.
        root_url: https://grafana.lab.local:8443/
      # SSO via Authentik (Phase 5 B6). ONE canonical issuer for
      # browser AND backend (B5 decision): all three URLs are the
      # public door — auth_url is followed by the BROWSER; token_url
      # and api_url are called by the POD (resolvable via the
      # lab.local CoreDNS zone, verified via tls_client_ca). Client
      # secret arrives as env, never in this ConfigMap.
      auth.generic_oauth:
        enabled: true
        name: Authentik
        client_id: grafana
        scopes: openid email profile roles
        auth_url: https://authentik.lab.local:8443/application/o/authorize/
        token_url: https://authentik.lab.local:8443/application/o/token/
        api_url: https://authentik.lab.local:8443/application/o/userinfo/
        # First SSO login creates the Grafana user (authorization
        # happens at Authentik: only grafana-* group members pass).
        allow_sign_up: true
        use_pkce: true
        # Role from the prefix-filtered roles claim: grafana-admins ->
        # org Admin; any other permitted user -> Viewer.
        role_attribute_path: contains(roles[*], 'grafana-admins') && 'Admin' || 'Viewer'
        # Local-only (see extraSecretMounts above).
        tls_client_ca: /etc/grafana/lab-ca/ca.crt
      auth:
        # Break-glass parity with OpenWebUI: the admin form stays.
        disable_login_form: false
    persistence:
      # Keeps hand-tuned dashboards across pod restarts (local-path PVC;
      # dashboards-as-code lands with the Phase 7 dashboard work).
      enabled: true
      size: 1Gi
    resources:
      requests:
        cpu: 100m
        memory: 192Mi
      limits:
        memory: 512Mi

  kube-state-metrics:
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 128Mi

  prometheus-node-exporter:
    resources:
      requests:
        cpu: 25m
        memory: 32Mi
      limits:
        memory: 64Mi
