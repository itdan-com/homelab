{{- if .Values.gitops.applicationSetEnabled }}
# The catalog auto-discovery engine. Scans catalog/*/argo.yaml in git;
# every chart that ships that file becomes an Application. No file, no
# deploy — which is also how _template stays excluded by construction.
#
# argo.yaml schema (per chart, all fields REQUIRED — explicit-default
# over implicit, per the catalog contract):
#   name: <application/release name — MUST equal the existing helm
#          release name so adopted resource names line up>
#   namespace: <destination namespace>
#   secrets: "true" | "false" — whether the chart ships secrets.enc.yaml
#          (adds the secrets:// value file via templatePatch below)
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: catalog
  labels:
    {{- include "catalog.labels" . | nindent 4 }}
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: {{ .Values.gitops.repoURL }}
        revision: {{ .Values.gitops.revision }}
        files:
          - path: "catalog/*/argo.yaml"
  template:
    metadata:
      name: '{{`{{ .name }}`}}'
    spec:
      project: default
      source:
        repoURL: {{ .Values.gitops.repoURL }}
        targetRevision: {{ .Values.gitops.revision }}
        path: 'catalog/{{`{{ .name }}`}}'
        helm:
          releaseName: '{{`{{ .name }}`}}'
          valueFiles:
            - values.yaml
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{`{{ .namespace }}`}}'
      syncPolicy:
        automated:
          selfHeal: true
          prune: {{ .Values.gitops.prune }}
        syncOptions:
          - CreateNamespace=true
          # kube-prometheus-stack CRDs overflow client-side apply's
          # last-applied annotation; server-side apply avoids it.
          - ServerSideApply=true
          # Without this, ignoreDifferences only affects the DIFF —
          # a sync would still overwrite the ignored fields.
          - RespectIgnoreDifferences=true
      # Live-owned certificate material ArgoCD must not fight. The
      # upstream ai-gateway chart regenerates its webhook certs on
      # EVERY render, so each catalog commit rotated the Secret while
      # the controller-patched caBundle went stale — and the Fail-policy
      # webhook then blocked ALL EG-provisioned pod creation (fleet
      # rollouts, KEDA scale-ups). Found at 5.5.4 when the sentinel
      # fleet's first pod was refused. Name-scoped, so inert for every
      # other app; caBundles are controller-patched by design generally.
      ignoreDifferences:
        - kind: Secret
          name: self-signed-cert-for-mutating-webhook
          jsonPointers:
            - /data
        - group: admissionregistration.k8s.io
          kind: MutatingWebhookConfiguration
          jqPathExpressions:
            - .webhooks[].clientConfig.caBundle
  # Conditional list items need the go-templated patch (per-field
  # templating can't add array entries).
  templatePatch: |
    {{`{{- if eq .secrets "true" }}`}}
    spec:
      source:
        helm:
          valueFiles:
            - values.yaml
            - secrets://secrets.enc.yaml
    {{`{{- end }}`}}
{{- end }}
