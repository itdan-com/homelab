nameOverride: ""
fullnameOverride: ""

catalog:
  tier: dev
  # Holds the repo deploy key (SOPS'd in secrets.enc.yaml).
  dataClass: secret

# ArgoCD's public door (Phase 5 B7) — house TLS pattern, rendered by
# OUR template (templates/argocd-ingress.yaml). Passes ADR-002's
# exposure policy: browsed + authenticated (SSO below + local admin).
# NOTE: this chart is NOT ArgoCD-self-managed (Phase 4 deferral) —
# applying changes here is a manual `helm secrets upgrade` (see
# NOTES.txt / operator cheatsheet).
argocdIngress:
  enabled: true
  host: argocd.lab.local
  # The argo-cd chart's server Service; server.insecure=true below
  # means Traefik terminates TLS and forwards plain HTTP — same
  # topology as every other door.
  service: argocd-server
  port: 80
  tls:
    issuer: lab-local-ca
    redirectPort: "8443"

# ---------------------------------------------------------------------------
# GitOps wiring consumed by templates/applicationset.yaml.
# ---------------------------------------------------------------------------
gitops:
  # false only for the very first install pass (the ApplicationSet CRD
  # ships in the same release and helm validates manifests up front);
  # the bootstrap runs install → upgrade, so the committed value is true.
  applicationSetEnabled: true
  repoURL: git@github.com:itdan-com/homelab.git
  revision: main
  # prune=false during adoption of pre-existing releases; flipped to true
  # 2026-07-25 once all five apps reached Synced/Healthy. With prune on,
  # deleting a chart (or its argo.yaml) removes its resources — offboarding
  # is a commit, same as onboarding.
  prune: true

argo-cd:
  # SSO comes with Authentik in Phase 5; local admin until then.
  dex:
    enabled: false
  # Enable when Phase 4.5 wants Slack/PR notifications.
  notifications:
    enabled: false

  configs:
    cm:
      # Track resources by ANNOTATION, not the app.kubernetes.io/instance
      # label — our charts set that label via catalog.selectorLabels and
      # Deployment selectors are immutable; letting ArgoCD rewrite it
      # would break adoption.
      application.instanceLabelKey: argocd.argoproj.io/instance
      # Allow helm-secrets' downloader scheme in valueFiles
      # (secrets://secrets.enc.yaml).
      helm.valuesFileSchemes: secrets, https
      # Public URL — OIDC redirects derive from this (Phase 5 B7).
      url: https://argocd.lab.local:8443
      # SSO via Authentik (B7), ArgoCD-native OIDC (dex stays off).
      # One canonical issuer (B5 decision): the public door, resolved
      # in-cluster by the lab.local CoreDNS zone. clientSecret is a
      # $-reference into argocd-secret (configs.secret.extra, SOPS).
      # Scopes deliberately EXCLUDE profile: authentik's built-in
      # profile mapping emits ALL group names as a `groups` claim,
      # which would collide with our prefix-filtered argocd-groups
      # mapping — openid+email+groups is everything ArgoCD needs.
      # rootCA: local-only (ADR-002) — the lab CA's PUBLIC cert so
      # ArgoCD's server-side discovery/token calls verify; delete on
      # cloud (Let's Encrypt). The local admin account stays enabled
      # (chart default) as break-glass, same decision as the other
      # two doors.
      oidc.config: |
        name: Authentik
        issuer: https://authentik.lab.local:8443/application/o/argocd/
        clientID: argocd
        clientSecret: $oidc.authentik.clientSecret
        requestedScopes: ["openid", "email", "groups"]
        rootCA: |
          -----BEGIN CERTIFICATE-----
          MIIBgzCCASigAwIBAgIUIs6RZknw98V66lkhSUcJAHZIZ4QwCgYIKoZIzj0EAwIw
          HzEdMBsGA1UEAxMUaG9tZWxhYiBsYWIubG9jYWwgQ0EwHhcNMjYwNzI2MjM1NjU2
          WhcNMzYwNzIzMjM1NjU2WjAfMR0wGwYDVQQDExRob21lbGFiIGxhYi5sb2NhbCBD
          QTBZMBMGByqGSM49AgEGCCqGSM49AwEHA0IABFeshrRIas9ZvMA3ejvSvbUUjraE
          Hnb+tyiZbSDa5DXrMdWnGV8g6w3f6bL2K1tx8L5KZZSY0U5HSUGMrp6iXEujQjBA
          MA4GA1UdDwEB/wQEAwICpDAPBgNVHRMBAf8EBTADAQH/MB0GA1UdDgQWBBTlp6FY
          TyLjrRMIDZ9VdmfVtErGhDAKBggqhkjOPQQDAgNJADBGAiEAmcurWHWVCrJGVS+j
          lURDsi1A3K+QKuSNmlpvOFFqUrUCIQCNzgxy9eu4Faljff3EgjPKnJB4etXQe7E8
          P5SDIG8OXQ==
          -----END CERTIFICATE-----
    # RBAC from the prefix-filtered groups claim: argocd-admins get
    # admin, argocd-users read-only. Default role EMPTY — an SSO
    # login with neither group sees nothing (and the IdP-side
    # bindings deny them before that anyway).
    rbac:
      policy.default: ""
      policy.csv: |
        g, argocd-admins, role:admin
        g, argocd-users, role:readonly
      scopes: "[groups]"
    params:
      # TLS terminates elsewhere (port-forward now, Traefik+cert-manager
      # in Phase 5); plain HTTP inside the cluster.
      server.insecure: true

  controller:
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        memory: 1Gi
  server:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi
  repoServer:
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 512Mi
    # ------------------------------------------------------------------
    # SOPS decryption (the Phase-4 bridge; Sentinel supersedes for
    # external creds at 5.5). Tools are version-PINNED and fetched by an
    # init container; the age private key mounts from the out-of-git
    # bootstrap Secret `helm-secrets-age` (see bootstrap script).
    # ------------------------------------------------------------------
    env:
      - name: HELM_PLUGINS
        value: /custom-tools/helm-plugins/
      - name: HELM_SECRETS_SOPS_PATH
        value: /custom-tools/sops
      - name: HELM_SECRETS_VALUES_ALLOW_SYMLINKS
        value: "false"
      - name: HELM_SECRETS_VALUES_ALLOW_ABSOLUTE_PATH
        value: "false"
      - name: HELM_SECRETS_VALUES_ALLOW_PATH_TRAVERSAL
        value: "false"
      - name: SOPS_AGE_KEY_FILE
        value: /helm-secrets-private-keys/key.txt
    volumes:
      - name: custom-tools
        emptyDir: {}
      - name: helm-secrets-private-keys
        secret:
          secretName: helm-secrets-age
    volumeMounts:
      - name: custom-tools
        mountPath: /custom-tools
      - name: helm-secrets-private-keys
        mountPath: /helm-secrets-private-keys
        readOnly: true
    initContainers:
      - name: download-tools
        image: alpine:3.20
        command: [sh, -ec]
        args:
          - |
            mkdir -p /custom-tools/helm-plugins/helm-secrets
            wget -qO- https://github.com/jkroepke/helm-secrets/releases/download/v4.6.5/helm-secrets.tar.gz | tar -C /custom-tools/helm-plugins -xzf -
            wget -qO /custom-tools/sops https://github.com/getsops/sops/releases/download/v3.13.1/sops-v3.13.1.linux.amd64
            chmod +x /custom-tools/sops
        volumeMounts:
          - name: custom-tools
            mountPath: /custom-tools
  applicationSet:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi
  redis:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 128Mi
