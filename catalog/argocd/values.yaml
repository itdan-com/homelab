nameOverride: ""
fullnameOverride: ""

catalog:
  tier: dev
  # Holds the repo deploy key (SOPS'd in secrets.enc.yaml).
  dataClass: secret

# ---------------------------------------------------------------------------
# GitOps wiring consumed by templates/applicationset.yaml.
# ---------------------------------------------------------------------------
gitops:
  # false only for the very first install pass (the ApplicationSet CRD
  # ships in the same release and helm validates manifests up front);
  # the bootstrap runs install → upgrade, so the committed value is true.
  applicationSetEnabled: true
  repoURL: git@github.com:itdan-com/homelab.git
  revision: main
  # prune=false during adoption of pre-existing releases; flipped to true
  # once every app shows Synced/Healthy with zero destructive diff.
  prune: false

argo-cd:
  # SSO comes with Authentik in Phase 5; local admin until then.
  dex:
    enabled: false
  # Enable when Phase 4.5 wants Slack/PR notifications.
  notifications:
    enabled: false

  configs:
    cm:
      # Track resources by ANNOTATION, not the app.kubernetes.io/instance
      # label — our charts set that label via catalog.selectorLabels and
      # Deployment selectors are immutable; letting ArgoCD rewrite it
      # would break adoption.
      application.instanceLabelKey: argocd.argoproj.io/instance
      # Allow helm-secrets' downloader scheme in valueFiles
      # (secrets://secrets.enc.yaml).
      helm.valuesFileSchemes: secrets, https
    params:
      # TLS terminates elsewhere (port-forward now, Traefik+cert-manager
      # in Phase 5); plain HTTP inside the cluster.
      server.insecure: true

  controller:
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        memory: 1Gi
  server:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi
  repoServer:
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 512Mi
    # ------------------------------------------------------------------
    # SOPS decryption (the Phase-4 bridge; Sentinel supersedes for
    # external creds at 5.5). Tools are version-PINNED and fetched by an
    # init container; the age private key mounts from the out-of-git
    # bootstrap Secret `helm-secrets-age` (see bootstrap script).
    # ------------------------------------------------------------------
    env:
      - name: HELM_PLUGINS
        value: /custom-tools/helm-plugins/
      - name: HELM_SECRETS_SOPS_PATH
        value: /custom-tools/sops
      - name: HELM_SECRETS_VALUES_ALLOW_SYMLINKS
        value: "false"
      - name: HELM_SECRETS_VALUES_ALLOW_ABSOLUTE_PATH
        value: "false"
      - name: HELM_SECRETS_VALUES_ALLOW_PATH_TRAVERSAL
        value: "false"
      - name: SOPS_AGE_KEY_FILE
        value: /helm-secrets-private-keys/key.txt
    volumes:
      - name: custom-tools
        emptyDir: {}
      - name: helm-secrets-private-keys
        secret:
          secretName: helm-secrets-age
    volumeMounts:
      - name: custom-tools
        mountPath: /custom-tools
      - name: helm-secrets-private-keys
        mountPath: /helm-secrets-private-keys
        readOnly: true
    initContainers:
      - name: download-tools
        image: alpine:3.20
        command: [sh, -ec]
        args:
          - |
            mkdir -p /custom-tools/helm-plugins/helm-secrets
            wget -qO- https://github.com/jkroepke/helm-secrets/releases/download/v4.6.5/helm-secrets.tar.gz | tar -C /custom-tools/helm-plugins -xzf -
            wget -qO /custom-tools/sops https://github.com/getsops/sops/releases/download/v3.13.1/sops-v3.13.1.linux.amd64
            chmod +x /custom-tools/sops
        volumeMounts:
          - name: custom-tools
            mountPath: /custom-tools
  applicationSet:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi
  redis:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 128Mi
