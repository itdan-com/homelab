# Data-plane knobs for the provisioned Envoy fleet (referenced by the
# Gateway's infrastructure.parametersRef).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: {{ include "catalog.fullname" . }}-proxy
  labels:
    {{- include "catalog.labels" . | nindent 4 }}
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        type: {{ .Values.envoyProxy.serviceType }}
      envoyDeployment:
        container:
          resources:
            {{- toYaml .Values.envoyProxy.resources | nindent 12 }}
  # Fleet-wide client identity for mTLS to backends. TLS only engages
  # where a BackendTLSPolicy demands it — here, exactly one place: the
  # Sentinel broker Backend. Plain-HTTP upstreams (the MCP servers behind
  # the proxy) never see this certificate.
  backendTLS:
    clientCertificateRef:
      group: ""
      kind: Secret
      name: {{ .Values.broker.clientCertSecret }}
