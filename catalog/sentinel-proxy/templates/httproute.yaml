# One rule per declared upstream: /<name>/* → that Service, with the
# routing prefix stripped (the upstream sees its own natural paths; the
# <name> segment is proxy metadata — and the server half of the
# capability scope the broker checks). ext_authz runs BEFORE this
# rewrite, so the broker always derives scope from the path the CALLER
# sent. Cross-namespace backendRefs are inert until the target namespace
# grants them (ReferenceGrant — the fronted workload's consent).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "catalog.fullname" . }}-upstreams
  labels:
    {{- include "catalog.labels" . | nindent 4 }}
spec:
  # group/kind/weight below are the API server's structural defaults,
  # rendered explicitly — implicit defaults are a permanent ArgoCD diff
  # (Phase 4 lesson).
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ include "catalog.fullname" . }}
  rules:
    {{- range .Values.upstreams }}
    - matches:
        - path:
            type: PathPrefix
            value: /{{ .name }}
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - group: ""
          kind: Service
          name: {{ .service }}
          namespace: {{ .namespace }}
          port: {{ .port }}
          weight: 1
    {{- end }}
