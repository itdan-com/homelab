# Unlike github-mcp, this workload DOES hold a credential — the upstream
# takes no per-request token, so the Slack identity is env-only. Both
# values come from SOPS; the chart renders nothing without them, so a
# half-configured install fails visibly rather than starting a server
# that authenticates as nobody (or worse, one whose HTTP auth is
# silently disabled).
{{- if and .Values.auth.token .Values.auth.apiKey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "catalog.fullname" . }}
  labels:
    {{- include "catalog.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ .Values.auth.token | quote }}
  apiKey: {{ .Values.auth.apiKey | quote }}
{{- end }}
