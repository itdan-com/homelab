{{/*
LiteLLM config rendered from values.yaml. Mounted at /app/config.yaml
in the container. Changes here trigger a pod rollout via the checksum
annotation on the Deployment template.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "catalog.fullname" . }}-config
  labels:
    {{- include "catalog.labels" . | nindent 4 }}
data:
  config.yaml: |
    model_list:
      {{- toYaml .Values.config.modelList | nindent 6 }}
    general_settings:
      {{- toYaml .Values.config.generalSettings | nindent 6 }}
