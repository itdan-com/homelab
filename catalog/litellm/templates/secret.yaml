{{/*
Secret with the LiteLLM master key + optional cloud-provider API keys.
Override via SOPS-encrypted secrets.enc.yaml:
  helm secrets install litellm . -n chat -f secrets.enc.yaml
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "catalog.fullname" . }}-auth
  labels:
    {{- include "catalog.labels" . | nindent 4 }}
type: Opaque
stringData:
  LITELLM_MASTER_KEY: {{ .Values.auth.masterKey | quote }}
  {{- if .Values.providerKeys.openaiApiKey }}
  OPENAI_API_KEY: {{ .Values.providerKeys.openaiApiKey | quote }}
  {{- end }}
  {{- if .Values.providerKeys.anthropicApiKey }}
  ANTHROPIC_API_KEY: {{ .Values.providerKeys.anthropicApiKey | quote }}
  {{- end }}
  {{- if .Values.providerKeys.geminiApiKey }}
  GEMINI_API_KEY: {{ .Values.providerKeys.geminiApiKey | quote }}
  {{- end }}
