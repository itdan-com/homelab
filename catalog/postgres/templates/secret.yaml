{{/*
The Postgres password Secret. Values come from .Values.auth and are
intended to be overridden by a SOPS-encrypted secrets.enc.yaml at
install time:

  helm secrets install postgres . -n chat -f secrets.enc.yaml

The default .Values.auth.postgresPassword in values.yaml is the
literal string "CHANGE_ME_VIA_SOPS_SECRETS" — fails closed if you
forget to pass the encrypted overrides.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "catalog.fullname" . }}-auth
  labels:
    {{- include "catalog.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.auth.username | quote }}
  POSTGRES_PASSWORD: {{ .Values.auth.postgresPassword | quote }}
  POSTGRES_DB: {{ .Values.auth.database | quote }}
  {{- range .Values.auth.extraUsers }}
  {{/* Exported into the container env (envFrom) so the initdb shell
       script can create app roles on fresh init without ever putting
       a password into a ConfigMap. */}}
  EXTRA_USER_PASSWORD_{{ .name | upper }}: {{ .password | quote }}
  {{- end }}
