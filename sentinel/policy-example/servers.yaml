# Per-server tool classification + resource derivation (ADR-005 D3).
# Leaves are scope.py leaf names (`<server>.<leaf>` on the wire);
# an entry ending `.*` is a prefix class — `rpc.*` covers the MCP
# handshake (initialize, tools.list, transport.get/delete), which is
# what makes an assigned server REACHABLE at zero approvals while an
# unassigned one cannot even complete initialize.
github:
  # Real tool names from the official server's `repos` and
  # `pull_requests` toolsets (v1.8.0). Anything not listed here is
  # UNCLASSIFIED and therefore denied — the platform does not guess
  # whether an unknown verb is dangerous — so this list is also the
  # place a new GitHub release gets reviewed rather than absorbed.
  tools:
    read: [get_file_contents, list_pull_requests, list_branches,
           list_commits, list_tags, list_releases, "rpc.*"]
    write: [create_pull_request, update_pull_request, merge_pull_request,
            create_or_update_file, create_branch]
    # Deliberately NOT classified, so they cannot be called at all:
    # delete_file, create_repository, list_repository_collaborators.
  resource:
    # TWO arguments, joined — GitHub sends owner and repo separately,
    # and `repo` alone would make acme/homelab and attacker/homelab the
    # same resource.
    from: [params.arguments.owner, params.arguments.repo]
    tiers:
      prod: [itdan-com/homelab]
echo:
  tools:
    read: [say, "rpc.*"]
hr-platform:
  tools:
    read: [lookup_employee, "rpc.*"]
    write: [update_record]
  resource:
    from: params.arguments.database
    tiers:
      prod: [hr_prod]
      staging: [hr_staging]
