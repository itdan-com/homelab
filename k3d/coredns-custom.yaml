# k3d/coredns-custom.yaml
#
# Declarative CoreDNS override: authoritative answer for
# host.docker.internal -> WSL2 gateway (the path to Ollama on Windows).
#
# WHY THIS EXISTS: k3d injects this mapping into the CoreDNS `NodeHosts`
# configmap at cluster create, but k3s OWNS NodeHosts and rewrote it
# during a restart (~2026-06-28), silently dropping the entry. Lookups
# then fell through to upstream Windows DNS, which answered with a stale
# Docker Desktop remnant from the Windows hosts file (192.168.50.102,
# unreachable) — so LiteLLM->Ollama died with "No route to host" while
# every pod still showed Running/healthy. Diagnosed 2026-07-25; see
# STATUS.md activity log.
#
# k3s never touches the `coredns-custom` configmap. The bundled Corefile
# imports /etc/coredns/custom/*.server at file scope, so the dedicated
# server block below answers authoritatively for this one zone and
# survives NodeHosts rewrites and cluster rebuilds — as long as it is
# re-applied after create.
#
# APPLY (after every cluster create, alongside k3d/portainer-agent.yaml):
#   kubectl apply -f k3d/coredns-custom.yaml
#   kubectl -n kube-system rollout restart deploy/coredns
#
# IF THE WSL2 GATEWAY IP CHANGES (check: `ip route show default`):
#   update the IP below, re-apply, restart coredns. It has been stable
#   at 172.19.80.1 since 2026-05-17 across multiple reboots.
#
# TWO DIFFERENT "HOST" IPs — do not conflate them:
#   172.19.80.1 = the WINDOWS host (WSL2 default gateway) — Ollama.
#   172.18.0.1  = the k3d docker network gateway (the WSL2 VM itself,
#                 check: `docker network inspect k3d-devlab`) — where
#                 docker publishes the cluster's ingress ports (8443).
#
# The lab.local block below is a LOCAL-ONLY shim (ADR-002): it lets
# PODS resolve the platform's public door names (authentik.lab.local,
# openwebui.lab.local, ...) so backends can call the SAME canonical
# https URLs the browser uses — e.g. OpenWebUI fetching Authentik's
# OIDC discovery/token endpoints (Phase 5 B5). Traffic hairpins:
# pod -> 172.18.0.1:8443 (docker publish) -> serverlb -> Traefik.
# In cloud, public DNS answers these names and this block is dead.
#
# The sentinel-broker.internal block (Phase 5.5.4) gives the Sentinel
# broker — which listens on the k3d network gateway (172.18.0.1:8401,
# the WSL2 VM itself, OUTSIDE the cluster) — a stable DNS name. The
# sentinel-proxy's ext_authz Backend and its BackendTLSPolicy SNI
# validation key off this name, and the broker's server cert carries
# it as a SAN, so no chart hardcodes the IP. Local-only shim like
# lab.local: in cloud, Sentinel's address is a real DNS record.
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns-custom
  namespace: kube-system
data:
  host-docker-internal.server: |
    host.docker.internal:53 {
        hosts {
            172.19.80.1 host.docker.internal
        }
    }
  lab-local.server: |
    lab.local:53 {
        template IN A {
            answer "{{ .Name }} 60 IN A 172.18.0.1"
        }
        template IN AAAA {
            rcode NOERROR
        }
    }
  sentinel-broker.server: |
    sentinel-broker.internal:53 {
        hosts {
            172.18.0.1 sentinel-broker.internal
        }
    }
