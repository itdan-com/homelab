# Read-only cluster identity for the operator Claude (Phase 4.5+).
# Bound to the built-in `view` ClusterRole, which deliberately EXCLUDES
# Secrets and all writes — the operator observes, and proposes changes
# only as pull requests. The namespace holds only this identity: the
# agent itself runs OUTSIDE the cluster (Phase 6 re-cut, 2026-07-28 —
# it must survive the cluster it repairs).
apiVersion: v1
kind: Namespace
metadata:
  name: platform-control
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: operator-view
  namespace: platform-control
---
# Long-lived token for the operator's kubeconfig (lab-grade; revisit
# when the operator gets its own home — Phase 9 gives it a VM).
apiVersion: v1
kind: Secret
metadata:
  name: operator-view-token
  namespace: platform-control
  annotations:
    kubernetes.io/service-account.name: operator-view
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: operator-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: operator-view
    namespace: platform-control
---
# Phase 6.2: nodes are cluster-scoped and NOT in the `view` role, so
# the operator could not see them at all (caught by the tick's first
# envelope run: 0 nodes read as healthy). A cluster operator gets to
# LOOK at nodes; get/list/watch is the whole grant.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: operator-node-reader
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: operator-node-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: operator-node-reader
subjects:
  - kind: ServiceAccount
    name: operator-view
    namespace: platform-control
---
# Phase 6.1: the operator's ONLY metrics path — Prometheus through the
# API-server service proxy, scoped to this ONE service by resourceNames.
# `view` covers reading Service OBJECTS; sending a request THROUGH one
# is the `services/proxy` subresource, which `view` deliberately lacks
# (found 2026-07-31: the charter's old `kubectl exec` fallback needed
# `pods/exec` create and so had never worked at all).
# Every URL-path spelling of the service is listed, because proxy
# authorization carries the name exactly as written in the request path.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: operator-prometheus-proxy
  namespace: monitoring
rules:
  - apiGroups: [""]
    resources: ["services/proxy"]
    verbs: ["get"]
    resourceNames:
      - monitoring-kube-prometheus-prometheus
      - "monitoring-kube-prometheus-prometheus:9090"
      - "monitoring-kube-prometheus-prometheus:http-web"
      - "http:monitoring-kube-prometheus-prometheus:9090"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: operator-prometheus-proxy
  namespace: monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: operator-prometheus-proxy
subjects:
  - kind: ServiceAccount
    name: operator-view
    namespace: platform-control
