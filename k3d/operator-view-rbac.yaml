# Read-only cluster identity for the Phase 4.5 operator Claude.
# Bound to the built-in `view` ClusterRole, which deliberately EXCLUDES
# Secrets and all writes — the operator observes, and proposes changes
# only as pull requests. The namespace is the future Phase-6 home of
# the full control plane.
apiVersion: v1
kind: Namespace
metadata:
  name: platform-control
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: operator-view
  namespace: platform-control
---
# Long-lived token for the operator's kubeconfig (lab-grade; replaced
# by short-lived projected tokens when the operator moves in-cluster
# at Phase 6).
apiVersion: v1
kind: Secret
metadata:
  name: operator-view-token
  namespace: platform-control
  annotations:
    kubernetes.io/service-account.name: operator-view
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: operator-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: operator-view
    namespace: platform-control
